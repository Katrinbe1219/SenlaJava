volumes:
  pgdata:
  kafka-senla-1-data:
  kafka-senla-2-data:
  kafka-senla-3-data:
  zookeeper-data:

networks:
  kafka-senla-network:
services:

  producer_senla:
    build: ./application
    ports:
      - "8082:8082"
    depends_on:
      kafka-senla-3:
        condition: service_healthy
      kafka-senla-2:
        condition: service_healthy
      kafka-senla-1:
        condition: service_healthy
    networks:
      kafka-senla-network:


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui
    depends_on:
      kafka-senla-1:
        condition: service_healthy
      kafka-senla-2:
        condition: service_healthy
      kafka-senla-3:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - kafka-senla-network
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-senla-1:9092,kafka-senla-2:9092,kafka-senla-3:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper_senla:2181


  postgres:
    image: postgres:18-alpine
    container_name: kafka-potgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: db_java_senla
      POSTGRES_USER: java_senla
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/liv/postgresql/data
      - ./init-db/ddl.sql:/docker-entrypoint-initdb.d/ddl.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U java senla -d java_senla_db"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
     - kafka-senla-network


  zookeeper_senla:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - kafka-senla-network

  kafka-senla-1:
    image: confluentinc/cp-kafka:latest
    hostname: kafka-senla-1
    depends_on:
      zookeeper_senla:
        condition: service_healthy
    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper_senla:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-senla-1:9092

      #ВНУТРЕННИЕ ТОПИКИ
      # каждая партиция будет иметь 3 копии на разных брокерах
      #replication factor для внутреннего топика, чтобы не терялись offsets
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      #replication factor для другого внутреннего топика, чтобы хранились сведения о транзакциях
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      # топик создается с автоматическим количеством репликаций
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      # минимум две реплики должны быть синхроны
      #если останется только 1 брокер -> запись с acks=all не пройдет
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_RETENTION_MS: 300000

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
    volumes:
      - kafka-senla-1-data:/var/lib/kafka/data
    networks:
      - kafka-senla-network

    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 3

  kafka-senla-2:
    image: confluentinc/cp-kafka:latest
    hostname: kafka-senla-2
    depends_on:
      zookeeper_senla:
        condition: service_healthy
    ports:
      - "9093:9092"


    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper_senla:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-senla-2:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_MS: 300000

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
    volumes:
      - kafka-senla-2-data:/var/lib/kafka/data
    networks:
      - kafka-senla-network

    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "9093" ]
      interval: 10s
      timeout: 5s
      retries: 3

  kafka-senla-3:
    image: confluentinc/cp-kafka:latest
    hostname: kafka-senla-3
    depends_on:
      zookeeper_senla:
        condition: service_healthy
    ports:
      - "9094:9092"


    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper_senla:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-senla-3:9094

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_MS: 300000

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
    volumes:
      - kafka-senla-3-data:/var/lib/kafka/data
    networks:
      - kafka-senla-network

    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "9094" ]
      interval: 10s
      timeout: 5s
      retries: 3


  consumer-1:
    build:
      context: ./consumer_application
      dockerfile: Dockerfile
    hostname: consumer-1
    depends_on:
      kafka-senla-1:
        condition: service_healthy
      kafka-senla-2:
        condition: service_healthy
      kafka-senla-3:
        condition: service_healthy
    networks:
      kafka-senla-network:

    environment:
      SPRING_KAFKA_CONSUMER_GROUP_ID: senla-group
      # список адресов для первичного подключению к кластеру, просто точка входа
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-senla-1:9092,kafka-senla-2:9093,kafka-senla-3:9094

  consumer-2:
    build:
      context: ./consumer_application
      dockerfile: Dockerfile
    hostname: consumer-2
    depends_on:
      kafka-senla-1:
        condition: service_healthy
      kafka-senla-2:
        condition: service_healthy
      kafka-senla-3:
        condition: service_healthy
    networks:
      kafka-senla-network:
    environment:
      SPRING_KAFKA_CONSUMER_GROUP_ID: senla-group
      # список адресов для первичного подключению к кластеру, просто точка входа
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-senla-1:9092,kafka-senla-2:9093,kafka-senla-3:9094

  consumer-3:
    build:
      context: ./consumer_application
      dockerfile: Dockerfile
    hostname: consumer-3
    depends_on:
      kafka-senla-1:
        condition: service_healthy
      kafka-senla-2:
        condition: service_healthy
      kafka-senla-3:
        condition: service_healthy
    networks:
      kafka-senla-network:
    environment:
      #для всх консьюмеров должно быть одно id,
      # в другом случае, каждый консьюмер получит все сообщения
      #когда одно id -> load balancing, сообщение обрабатывается одним консьюмером
      SPRING_KAFKA_CONSUMER_GROUP_ID: senla-group
      # список адресов для первичного подключению к кластеру, просто точка входа
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-senla-1:9092,kafka-senla-2:9093,kafka-senla-3:9094




