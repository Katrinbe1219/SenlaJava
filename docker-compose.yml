services:
  senla_db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: db_java_senla
      POSTGRES_USER: java_senla
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - senla-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U java_senla -d db_java_senla" ]
      interval: 5s
      timeout: 5s
      retries: 5


  spring_senla:
    build: ./application
    ports:
      - "8080:8080"
    depends_on:
      senla_db:
        condition: service_healthy
    networks:
      - senla-net


volumes:
  pgdata:


networks:
  senla-net:
